# Builds AyuGram Desktop v7.2.9 with cosmetics.patch applied on top.
# Libraries and compiled objects are cached between runs, so a rerun resumes
# after a timeout and a small patch change recompiles only what it touches.
name: Build AyuGram (cosmetics)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      UPSTREAM_REF: v7.2.9
      REPO_NAME: AyuGramDesktop
      # WHY: writing the debug database ran the linker out of memory.
      _LINK_: /DEBUG:NONE
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          git config --global core.autocrlf false
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get the patch.
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Clone AyuGram.
        shell: bash
        run: |
          git clone --depth=1 --branch "$UPSTREAM_REF" \
            https://github.com/AyuGram/AyuGramDesktop.git "$TBUILD/$REPO_NAME"
          cd "$TBUILD/$REPO_NAME"
          git submodule update --init --depth=1

      - name: Apply the patch.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patch-repo/cosmetics.patch"
          git status --short

      - name: Restore the compiled objects.
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ninja-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ninja-

      # WHY: a fresh clone gives every file a new date, which makes MSBuild
      # recompile everything. All sources get one old date, and only files
      # whose content differs from the last successful build get a new one.
      - name: Normalize source dates.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          find . -path ./out -prune -o -name .git -prune -o -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha1sum > "$RUNNER_TEMP/source.sha"
          find . -path ./out -prune -o -name .git -prune -o -type f -print0 \
            | xargs -0 touch -d '2020-01-01 00:00:00 UTC'
          if [ -f out/source.sha ]; then
            awk 'NR==FNR { old[substr($0, 41)] = substr($0, 1, 40); next }
              old[substr($0, 41)] != substr($0, 1, 40) { print substr($0, 43) }' \
              out/source.sha "$RUNNER_TEMP/source.sha" > "$RUNNER_TEMP/changed.txt"
            echo "Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
            cat "$RUNNER_TEMP/changed.txt"
            while IFS= read -r file; do touch "$file"; done < "$RUNNER_TEMP/changed.txt"
          fi

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: ilammy/msvc-dev-cmd@v1
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore the libraries cache.
        id: libsCache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.LibrariesPath }}
          key: libs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: libs-

      # WHY: a cold library build can take most of the 6 hour job limit, so it
      # is stopped early and whatever finished is cached for the next run.
      - name: Libraries.
        id: libs
        timeout-minutes: 240
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      # An unchanged library set is already in the cache.
      - name: Save the libraries cache.
        if: always() && (steps.libs.outcome != 'success' || steps.libsCache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TBUILD }}\ThirdParty
            ${{ env.LibrariesPath }}
          key: libs-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop when the libraries are unfinished.
        if: steps.libs.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The Libraries step failed or timed out, check its log. A timeout continues from the cache on rerun."
          exit 1

      - name: Generate a stub DesktopPrivate.
        shell: bash
        run: |
          mkdir -p $TBUILD/DesktopPrivate
          printf 'const char *PrivateKey = "";\nconst char *PrivateBetaKey = "";\n' > $TBUILD/DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "";\n' > $TBUILD/DesktopPrivate/alpha_private.h
          touch -d '2020-01-01 00:00:00 UTC' $TBUILD/DesktopPrivate/*.h

      - name: Configure.
        run: |
          where ninja
          cd %TBUILD%\%REPO_NAME%\Telegram
          if exist ..\out\CMakeCache.txt exit /b 0
          call configure.bat "-GNinja Multi-Config" ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_OBJECT_PATH_MAX=180 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      # WHY: runners were lost to memory pressure with four compilers at once,
      # and a lost runner saves nothing. Ninja keeps per-file progress, so the
      # build runs in slices with the objects saved after each one.
      - name: Build, part 1.
        id: b1
        timeout-minutes: 55
        continue-on-error: true
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config Release --target Telegram --parallel 3 -- -k 0

      - name: Save progress 1.
        if: steps.b1.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ninja-${{ github.run_id }}-${{ github.run_attempt }}-1

      - name: Build, part 2.
        id: b2
        if: steps.b1.outcome != 'success'
        timeout-minutes: 55
        continue-on-error: true
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config Release --target Telegram --parallel 3 -- -k 0

      - name: Save progress 2.
        if: steps.b1.outcome != 'success' && steps.b2.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ninja-${{ github.run_id }}-${{ github.run_attempt }}-2

      - name: Build, part 3.
        id: b3
        if: steps.b1.outcome != 'success' && steps.b2.outcome != 'success'
        timeout-minutes: 55
        continue-on-error: true
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config Release --target Telegram --parallel 3 -- -k 0

      - name: Save progress 3.
        if: steps.b1.outcome != 'success' && steps.b2.outcome != 'success' && steps.b3.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ninja-${{ github.run_id }}-${{ github.run_attempt }}-3

      - name: Build, part 4.
        id: b4
        if: steps.b1.outcome != 'success' && steps.b2.outcome != 'success' && steps.b3.outcome != 'success'
        timeout-minutes: 55
        continue-on-error: true
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config Release --target Telegram --parallel 3 -- -k 0

      - name: Upload the app.
        if: steps.b1.outcome == 'success' || steps.b2.outcome == 'success' || steps.b3.outcome == 'success' || steps.b4.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-cosmetics-win64
          path: |
            ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Release\*.exe
            ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Release\modules\**
          retention-days: 14

      # The list of built sources is kept only after a successful build, so
      # files left uncompiled by a failed run are compiled by the next one.
      - name: Prepare the objects for the cache.
        if: always()
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME/out"
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            rm -f Release/*.pdb
            cp "$RUNNER_TEMP/source.sha" source.sha
          fi
          du -sh . || true

      - name: Save the compiled objects.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ninja-${{ github.run_id }}-${{ github.run_attempt }}-final

      - name: Report an unfinished build.
        if: steps.upload.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The Build step failed or timed out, check its log. A timeout continues from the cache on rerun."
          exit 1
